name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan, tsan]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build redis-tools \
            libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc

      # TSan's fixed memory layout does not fit the 32-bit mmap randomisation
      # used by the runner's kernel ("unexpected memory mapping").
      - name: Reduce ASLR entropy for TSan
        if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --timeout 300

  # Infrastructure checks that need no AWS account: formatting, validation,
  # and a plan against mocked providers (deploy/terraform/tests).
  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform -chdir=deploy/terraform fmt -recursive -check

      - name: Terraform validate and test
        run: |
          terraform -chdir=deploy/terraform init -backend=false -input=false
          terraform -chdir=deploy/terraform validate
          terraform -chdir=deploy/terraform test

      - name: Shellcheck
        run: shellcheck -x deploy/scripts/*.sh scripts/*.sh tests/integration/*.sh bench/*.sh
